<style>.biolyx-wallpaper-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.wallpaper-option .wallpaper-preview{z-index:0}.wallpaper-option::after{z-index:1}.wallpaper-label{z-index:2;position:relative}</style>
<script>
const PREFIX = `
precision highp float;
uniform vec2 iResolution;
uniform float iTime;

float hash(vec2 p){
  p = fract(p*vec2(123.34, 456.21));
  p += dot(p, p+45.32);
  return fract(p.x*p.y);
}
float noise(vec2 p){
  vec2 i = floor(p); vec2 f = fract(p);
  float a = hash(i), b = hash(i+vec2(1.0,0.0));
  float c = hash(i+vec2(0.0,1.0)), d = hash(i+vec2(1.0,1.0));
  vec2 u = f*f*(3.0-2.0*f);
  return mix(a,b,u.x) + (c-a)*u.y*(1.0-u.x) + (d-b)*u.x*u.y;
}
float fbm(vec2 p){
  float v=0.0, amp=0.5;
  for(int i=0;i<5;i++){ v += amp*noise(p); p *= 2.02; amp *= 0.5; }
  return v;
}
`;
const SHADERS = [
  `void main(){
    vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
    vec2 p=uv*1.5; float t=iTime*0.15;
    vec2 warp=vec2(fbm(p+t),fbm(p-t+10.0));
    float n=fbm(p*2.0+warp*2.2);
    float angle=atan(uv.y,uv.x);
    float hueShift=n*3.2+angle*0.5+t*2.0;
    vec3 col=0.5+0.5*cos(6.28318*(hueShift+vec3(0.0,0.33,0.67)));
    col+=pow(n,3.0)*0.35;
    col=pow(col,vec3(0.85));
    gl_FragColor=vec4(col,1.0);
  }`,

  `void main(){
    vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
    vec2 p=uv*2.0; float t=iTime*0.12;
    vec2 q=vec2(fbm(p+t),fbm(p+vec2(5.2,1.3)-t));
    vec2 r=vec2(fbm(p+4.0*q+vec2(1.7,9.2)+0.15*t),fbm(p+4.0*q+vec2(8.3,2.8)+0.126*t));
    float n=fbm(p+4.0*r);
    vec3 col=mix(vec3(0.02,0.0,0.0),vec3(0.55,0.0,0.0),smoothstep(0.0,0.4,n));
    col=mix(col,vec3(0.95,0.25,0.0),smoothstep(0.3,0.6,n));
    col=mix(col,vec3(1.0,0.65,0.05),smoothstep(0.55,0.78,n));
    col=mix(col,vec3(1.0,0.96,0.7),smoothstep(0.75,0.98,n));
    gl_FragColor=vec4(col,1.0);
  }`,

  `void main(){
    vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
    float t=iTime*0.35, m=0.0; vec3 col=vec3(0.0);
    vec3 pal[6];
    pal[0]=vec3(1.0,0.2,0.5); pal[1]=vec3(0.2,0.6,1.0); pal[2]=vec3(1.0,0.8,0.1);
    pal[3]=vec3(0.55,0.2,1.0); pal[4]=vec3(0.1,1.0,0.6); pal[5]=vec3(1.0,0.4,0.1);
    for(int i=0;i<6;i++){
      float fi=float(i);
      vec2 c=vec2(sin(t*0.7+fi*2.1)*0.62,cos(t*0.5+fi*1.7)*0.48);
      float d=length(uv-c), blob=0.045/(d*d+0.01);
      m+=blob; col+=pal[i]*blob;
    }
    col/=max(m,0.001);
    float glow=smoothstep(0.55,3.2,m);
    col=mix(vec3(0.015,0.015,0.03),col,clamp(glow,0.0,1.0));
    gl_FragColor=vec4(col,1.0);
  }`,

  // 3 - LIQUID NEON: smooth large light fields, no noise/fog
  `void main(){
    vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
    float t=iTime*0.055;

    vec2 a=vec2(
      -0.38+0.16*sin(t*1.10),
       0.12+0.11*cos(t*0.82)
    );
    vec2 b=vec2(
       0.36+0.14*cos(t*0.91+1.3),
      -0.10+0.13*sin(t*0.76+0.7)
    );
    vec2 c=vec2(
       0.03+0.10*sin(t*0.63+2.0),
       0.34+0.10*cos(t*0.70+1.1)
    );
    vec2 d=vec2(
      -0.08+0.10*cos(t*0.58+3.2),
      -0.37+0.09*sin(t*0.67+2.1)
    );

    float ga=exp(-dot(uv-a,uv-a)/0.34);
    float gb=exp(-dot(uv-b,uv-b)/0.30);
    float gc=exp(-dot(uv-c,uv-c)/0.26);
    float gd=exp(-dot(uv-d,uv-d)/0.30);

    vec3 bg=vec3(0.006,0.008,0.020);
    vec3 col=bg;
    col+=vec3(0.14,0.42,1.00)*ga*1.15;
    col+=vec3(0.72,0.20,1.00)*gb*1.05;
    col+=vec3(0.08,0.86,0.95)*gc*0.95;
    col+=vec3(0.42,0.16,0.95)*gd*0.78;

    float blend=exp(-dot(uv,uv)/1.10);
    col+=vec3(0.025,0.040,0.10)*blend;

    // Very soft overlap, like polished glass / iOS wallpaper light.
    float glow=(ga*gb+gb*gc+gc*ga)*0.10;
    col+=vec3(0.18,0.23,0.55)*glow;

    col=col/(1.0+col*0.40);
    col=pow(max(col,0.0),vec3(0.94));
    gl_FragColor=vec4(col,1.0);
  }`,

  // 4 - SOFT SPACE: clean blurred gradients, no FBM/noise/fog
  `void main(){
    vec2 uv=(gl_FragCoord.xy-0.5*iResolution.xy)/iResolution.y;
    float t=iTime*0.045;

    vec2 p1=vec2(
      -0.42+0.13*cos(t*0.95),
       0.18+0.10*sin(t*0.72)
    );
    vec2 p2=vec2(
       0.34+0.12*sin(t*0.78+1.4),
      -0.14+0.12*cos(t*0.66+0.4)
    );
    vec2 p3=vec2(
      -0.02+0.09*cos(t*0.58+2.5),
       0.42+0.08*sin(t*0.83+1.0)
    );

    float g1=exp(-dot(uv-p1,uv-p1)/0.38);
    float g2=exp(-dot(uv-p2,uv-p2)/0.34);
    float g3=exp(-dot(uv-p3,uv-p3)/0.30);

    vec3 col=vec3(0.004,0.006,0.016);
    col+=vec3(0.12,0.35,1.00)*g1*0.92;
    col+=vec3(0.58,0.16,1.00)*g2*0.86;
    col+=vec3(0.06,0.72,0.95)*g3*0.58;

    // Broad light transitions instead of texture or particle noise.
    float center=exp(-dot(uv,uv)/0.95);
    col+=vec3(0.018,0.028,0.075)*center;

    float edge=1.0-smoothstep(0.35,1.05,length(uv));
    col*=0.86+0.14*edge;

    col=col/(1.0+col*0.32);
    col=pow(max(col,0.0),vec3(0.96));
    gl_FragColor=vec4(col,1.0);
  }`
];
const BIOLYX_WALLPAPER_NAMES = ['Iridescent','Magma','Flow Orbs','Liquid Neon','Soft Cosmos'];
function compile(gl,src,type){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s)||'shader');return s}
function build(gl,frag){const v=`attribute vec2 aPos;void main(){gl_Position=vec4(aPos,0.0,1.0);}`;const p=gl.createProgram();gl.attachShader(p,compile(gl,v,gl.VERTEX_SHADER));gl.attachShader(p,compile(gl,PREFIX+frag,gl.FRAGMENT_SHADER));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p)||'program');return p}
window.BiolyxWallpaperModule={names:BIOLYX_WALLPAPER_NAMES,mountPreviews(){document.querySelectorAll('.wallpaper-option').forEach((card,i)=>{const host=card.querySelector('.wallpaper-preview');if(!host||host.dataset.shaderMounted||i>=SHADERS.length)return;host.dataset.shaderMounted='1';const c=document.createElement('canvas');c.className='biolyx-wallpaper-canvas';host.appendChild(c);const gl=c.getContext('webgl',{antialias:true,alpha:false})||c.getContext('experimental-webgl');if(!gl)return;const prog=build(gl,SHADERS[i]);const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);const started=performance.now();function resize(){const r=host.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,1.4);c.width=Math.max(1,r.width*d);c.height=Math.max(1,r.height*d);gl.viewport(0,0,c.width,c.height)}function draw(){gl.useProgram(prog);const a=gl.getAttribLocation(prog,'aPos');gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);gl.uniform2f(gl.getUniformLocation(prog,'iResolution'),c.width,c.height);gl.uniform1f(gl.getUniformLocation(prog,'iTime'),(performance.now()-started)/1000);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(draw)}resize();addEventListener('resize',resize);requestAnimationFrame(draw)})};
</script>
